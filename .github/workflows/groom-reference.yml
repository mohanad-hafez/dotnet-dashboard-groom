name: Dashboard reference
on:
  push:
    branches: [checks-groom-reference-01]
permissions:
  contents: read
  issues: write
jobs:
  reference:
    if: github.repository == 'mohanad-hafez/dotnet-dashboard-groom'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/data
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {createGroomFixture}=await import(process.env.GITHUB_WORKSPACE+'/.github/scripts/groom_fixture.mjs');
            await createGroomFixture({github,context});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: groom-reference
          path: groom-fixture-result.json
          retention-days: 7
