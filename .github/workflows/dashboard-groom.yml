name: Dashboard grooming
on:
  push:
    branches: [replacement-dashboard-groom-01]
    paths: [.github/dashboard-groom-ready]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: dashboard-groom
  cancel-in-progress: false
jobs:
  groom:
    if: github.repository == 'mohanad-hafez/dotnet-dashboard-groom'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/data
      - name: Check update rules
        run: node --test .github/scripts/groom_dashboard.test.mjs
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {runGroom}=await import(process.env.GITHUB_WORKSPACE+'/.github/scripts/groom_run.mjs');
            await runGroom({github,context});
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: groom-result
          path: groom-result.json
          retention-days: 7
