name: Matched dashboard grooming
on:
  push:
    branches: [matched-dashboard-groom-01]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'mohanad-hafez/dotnet-dashboard-groom'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      matrix:
        task: [groom]
        arm: [agent, script]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Copilot
        if: matrix.arm == 'agent'
        run: npm install --global @github/copilot@1.0.108
      - name: Prepare and validate the issue
        working-directory: .github/matched
        env:
          TASK: ${{ matrix.task }}
          ARM: ${{ matrix.arm }}
          GITHUB_TOKEN: ${{ matrix.arm == 'agent' && github.token || '' }}
        run: |
          mkdir evidence
          if [ "$ARM" = agent ]; then
            node -e 'const c=process.cwd();console.log(JSON.stringify({mcpServers:{fixture:{type:"local",command:"node",args:[c+"/component_fixture.cjs",c+"/"+process.env.TASK+".json",c+"/evidence/tools.jsonl"],tools:["*"]}}}))' > fixture-mcp.json
            timeout 150s copilot --disable-builtin-mcps --disable-client-telemetry \
              --additional-mcp-config=@fixture-mcp.json \
              --available-tools=fixture-read_input,fixture-publish_result \
              --allow-tool=fixture --no-ask-user --no-color --silent \
              --prompt "$(cat "$TASK-prompt.md")" > evidence/output.txt 2> evidence/diagnostics.txt
          fi
          node groom-arm.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reminder-${{ matrix.task }}-${{ matrix.arm }}
          path: .github/matched/evidence/
          retention-days: 14
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    strategy:
      fail-fast: false
      matrix:
        task: [groom]
        arm: [agent, script]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: reminder-${{ matrix.task }}-${{ matrix.arm }}
          path: evidence
      - name: Publish the matched reminder
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          TASK: ${{ matrix.task }}
          ARM: ${{ matrix.arm }}
        with:
          retries: 0
          script: |
            const fs = require('node:fs');
            const {createHash} = require('node:crypto');
            const hash = body => createHash('sha256').update(body).digest('hex');
            const target = {"agent":{"number":2,"url":"https://github.com/mohanad-hafez/dotnet-dashboard-groom/issues/2","title":"Test dashboard agent"},"script":{"number":3,"url":"https://github.com/mohanad-hafez/dotnet-dashboard-groom/issues/3","title":"Test dashboard script"}}[process.env.ARM];
            const report = JSON.parse(fs.readFileSync('evidence/result.json','utf8'));
            const current = (await github.rest.issues.get({...context.repo,issue_number:target.number})).data;
            if (current.state !== 'open' || current.title !== target.title || hash(current.body) !== 'ccba34df83523662dc76121b1ea504e80bafdf084fe07e742cdd97c4b6cf57a4') throw Error('Test dashboard changed');
            if (hash(report.body) !== 'aa495144272d246b4d5b8a9f72503b6af2287f07e0caa7091ba6319cd6558df7' || report.hides.length) throw Error('Unexpected proposed update');
            const response = await github.rest.issues.update({...context.repo,issue_number:target.number,body:report.body});
            fs.writeFileSync('publication.json',JSON.stringify({number:response.data.number,url:response.data.html_url}));
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-${{ matrix.task }}-${{ matrix.arm }}
          path: publication.json
          retention-days: 14
